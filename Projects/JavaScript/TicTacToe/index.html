<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">

        <div class="o-score">
            <p id="o-score-icon">◯</p><div class="o-score-box">0</div>
        </div>

        <div class="game-container">
            <div class="winner-text">
                
            </div>

            <div class="game-grid">
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
                <div class="box"></div>
            </div>

            <div class="game-controls">
                <button class="reset-btn">R E S E T</button>
            </div>
        </div>

        <div class="x-score">
            <p id="x-score-icon">✖</p><div class="x-score-box">0</div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
